# 하루한판 CI/CD
#   PR·push: 테스트
#   main 에 push: 테스트 → ARM 이미지 빌드 → GHCR (sha-<커밋 7자리>, latest)
#                 → production 환경 승인 → 서버에 SSH 로 배포 (서버의 deploy.sh 가 헬스 체크, 실패하면 되돌림)
# 서버 VM 이 ARM(Ampere A1)이라 ARM 실행기에서 빌드한다 (공개 저장소는 무료).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # 배포 중인 작업을 끊지 않는다

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 테스트
        run: ./gradlew test --no-daemon
      - name: 테스트 결과 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: jar 빌드
        run: ./gradlew bootJar --no-daemon
      - id: meta
        name: 태그
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: 이미지 빌드·업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    # 승인 후 배포: 저장소 Settings → Environments → production 의 Required reviewers 가 승인해야 시작한다
    environment:
      name: production
      url: https://haruhanpan.duckdns.org
    steps:
      - name: 서버에 배포
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # deploy 계정의 키는 서버의 deploy.sh 만 실행할 수 있다. 넘기는 값은 태그 하나
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "$TAG"
      - name: 공개 주소 확인
        run: curl -fsS --retry 5 --retry-delay 3 https://haruhanpan.duckdns.org/api/health
