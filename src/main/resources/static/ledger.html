<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루가계부</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루한판">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" title="홈으로">하루<span>가계부</span></a>
    <div class="space-pick">
      <select id="space-sel" aria-label="가계부 공간" title="개인 공간 = 내 가계부, 팀 공간 = 함께 쓰는 가계부"></select>
    </div>
    <nav class="tabs"></nav>
    <div class="tools">
      <span class="save-state" id="save-state"></span>
      <a class="btn ghost small" href="/" title="홈 (앱 고르기)">🏠<span class="label-text"> 홈</span></a>
      <button class="ghost small" id="btn-dashboard" title="같은 공간의 하루한판으로">📋<span class="label-text"> 하루한판</span></button>
      <button class="icon" id="btn-theme" data-m="라이트/다크 전환" title="라이트/다크 전환" aria-label="테마 전환">◐</button>
      <span class="muted small" id="me-name" data-m-info></span>
      <button class="ghost small" id="btn-logout" data-m="로그아웃">로그아웃</button>
    </div>
  </div>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<dialog id="dlg"></dialog>
<script src="/ledger.js"></script>
<script src="/menu.js"></script>
</body>
</html>
